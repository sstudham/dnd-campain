<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<rect width="1400" height="900" fill="#f6f1e5"/>
<style>text{font-family:Arial,sans-serif;fill:#26372f}.title{font-size:36px;font-weight:700}.sub{font-size:19px}.label{font-size:22px;font-weight:700}.small{font-size:18px}.tiny{font-size:16px}</style>
<text x="45" y="58" class="title">THE NORTHERN CAMP</text>
<text x="45" y="91" class="sub">Visible layout • Choose your entry and departure • Schematic, not a battle grid</text>
<path d="M 690 775 L 690 680 L 365 565 L 380 300 L 760 235 L 1040 475 L 690 680" fill="none" stroke="#7d6d54" stroke-width="22" stroke-linecap="round"/>
<path d="M 180 760 L 65 500 L 90 340" fill="none" stroke="#577b66" stroke-width="8" stroke-linecap="round" stroke-dasharray="13 10"/>
<path d="M 1040 475 L 1230 440 L 1240 200" fill="none" stroke="#577b66" stroke-width="8" stroke-linecap="round" stroke-dasharray="13 10"/>
<rect x="490" y="720" width="410" height="110" rx="9" fill="#fffdf6" stroke="#929c89" stroke-width="2"/>
<text x="508" y="754" class="label">A  DELIVERY ENTRANCE</text>
<text x="508" y="788" class="small">Road to the chalk cut and Greenest</text>
<rect x="175" y="520" width="390" height="125" rx="9" fill="#fffdf6" stroke="#929c89" stroke-width="2"/>
<text x="193" y="554" class="label">B  WAGON YARD</text>
<text x="193" y="588" class="small">Loads, draft animals and dispatch clerk</text>
<text x="193" y="615" class="small">A busy place to ask practical questions</text>
<rect x="90" y="270" width="385" height="135" rx="9" fill="#fffdf6" stroke="#929c89" stroke-width="2"/>
<text x="108" y="304" class="label">C  WORKERS QUARTERS</text>
<text x="108" y="338" class="small">Hired laborers and cooking fires</text>
<text x="108" y="365" class="small">Laundry path enters from the west</text>
<rect x="560" y="155" width="405" height="145" rx="9" fill="#fffdf6" stroke="#929c89" stroke-width="2"/>
<text x="578" y="189" class="label">D  SURVEY AND RECORDS TENT</text>
<text x="578" y="223" class="small">Map cabinet and survey tables</text>
<text x="578" y="250" class="small">Workers bring measurements here</text>
<rect x="835" y="440" width="410" height="135" rx="9" fill="#fffdf6" stroke="#929c89" stroke-width="2"/>
<text x="853" y="474" class="label">E  SIGNAL AND STORES YARD</text>
<text x="853" y="508" class="small">Covered tools and signal equipment</text>
<text x="853" y="535" class="small">Narrow path climbs toward the ridge</text>
<rect x="965" y="665" width="365" height="130" rx="9" fill="#fffdf6" stroke="#929c89" stroke-width="2"/>
<text x="983" y="699" class="label">F  WATCH POST</text>
<text x="983" y="733" class="small">Clear view of the main entrance</text>
<text x="983" y="760" class="small">Bell rope hangs by the awning</text>
<path d="M 690 680 L 960 730" fill="none" stroke="#7d6d54" stroke-width="10" stroke-linecap="round"/>
<text x="48" y="195" class="label">N ↑</text>
<text x="45" y="850" class="small">Solid road: normal traffic. Dashed paths: foot access. The canvas perimeter has gaps, not an invisible wall.</text>
</svg>